<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>公众号文章存为 Markdown</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <main class="container">
        <h1>公众号文章存为 Markdown</h1>

        <div id="status" class="status info">正在读取页面…</div>

        <section id="articleInfo" class="article-info" hidden>
            <h2 id="articleTitle"></h2>
            <p class="meta"><span id="articleAccount"></span><span id="articleTime"></span></p>
        </section>

        <div class="button-group">
            <button id="saveBtn" disabled>保存为 Markdown</button>
            <button id="sendBtn" class="secondary" disabled>发送到本地命令行</button>
        </div>

        <p class="footer">
            图片保留微信原始链接。「发送到本地命令行」需要先在电脑上运行
            <code>python -m wechat_downloader.receiver</code>
        </p>
    </main>

    <script src="extract.js"></script>
    <script src="markdown.js"></script>
    <script src="popup.js"></script>
</body>
</html>
